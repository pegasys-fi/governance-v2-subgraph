specVersion: 0.0.2
description: Pegasys governance V2 subgraph
repository: https://github.com/pegasys-fi/governance-v2-subgraph
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum/contract
    name: PegasysGovernanceV2
    network: { { network } }
    source:
      abi: PegasysGovernanceV2
      address: '{{pegasysGovernanceV2Address}}'
      startBlock: { { pegasysGovernanceV2StartBlock } }
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.4
      language: wasm/assemblyscript
      entities:
        - Proposal
        - Vote
        - Executor
      abis:
        - name: PegasysGovernanceV2
          file: ./externals/governance-v2/artifacts/contracts/governance/PegasysGovernanceV2.sol/PegasysGovernanceV2.json
        - name: IExecutor
          file: ./externals/governance-v2/artifacts/contracts/governance/Executor.sol/Executor.json
        - name: GovernanceStrategy
          file: ./externals/governance-v2/artifacts/contracts/governance/GovernanceStrategy.sol/GovernanceStrategy.json
      eventHandlers:
        - event: ProposalCreated(uint256,indexed address,indexed address,address[],uint256[],string[],bytes[],bool[],uint256,uint256,address,bytes32)
          handler: handleProposalCreated
        - event: ProposalCanceled(uint256)
          handler: handleProposalCanceled
        - event: ProposalQueued(uint256,uint256,indexed address)
          handler: handleProposalQueued
        - event: ProposalExecuted(uint256,indexed address)
          handler: handleProposalExecuted
        - event: VoteEmitted(uint256,indexed address,bool,uint256)
          handler: handleVoteEmitted
        - event: ExecutorAuthorized(address)
          handler: handleExecutorAuthorized
        - event: ExecutorUnauthorized(address)
          handler: handleExecutorUnauthorized
      file: ./src/mapping/governance.ts
  - kind: ethereum/contract
    name: PegasysTokenV2
    network: { { network } }
    source:
      abi: PegasysTokenV2
      address: '{{psysTokenV2Address}}'
      startBlock: { { psysTokenV2StartBlock } }
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.4
      language: wasm/assemblyscript
      entities:
        - Delegate
      abis:
        - name: PegasysTokenV2
          file: ./externals/psys-token-v2/artifacts/contracts/token/PegasysTokenV2.sol/PegasysTokenV2.json
      eventHandlers:
        - event: DelegateChanged(indexed address,indexed address,uint8)
          handler: handleDelegateChanged
        - event: Transfer(indexed address,indexed address,uint256)
          handler: handleTransfer
      file: ./src/mapping/psys-token.ts
  - kind: ethereum/contract
    name: StakedTokenV3
    network: { { network } }
    source:
      abi: StakedTokenV3
      address: '{{pegasysStakeTokenAddress}}'
      startBlock: { { pegasysStakeTokenStartBlock } }
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.4
      language: wasm/assemblyscript
      entities:
        - Delegate
      abis:
        - name: StakedTokenV3
          file: ./externals/stake/artifacts/contracts/stake/StakedTokenV3.sol/StakedTokenV3.json
      eventHandlers:
        - event: Transfer(indexed address,indexed address,uint256)
          handler: handleTransfer
        - event: DelegateChanged(indexed address,indexed address,uint8)
          handler: handleDelegateChanged
      file: ./src/mapping/stake.ts
